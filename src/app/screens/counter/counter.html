<div class="flex flex-col gap-6">
  <app-title title="Contador" subtitle="Exemplo de contador simples" />

  <div>
    <span class="text-5xl font-black">{{ count() }}</span>
  </div>
  <div class="flex gap-3">
    <button (click)="increment()" class="btn btn-primary">Incrementar</button>
    <button (click)="decrement()" class="btn btn-danger">Decrementar</button>
    <button (click)="reset()" class="btn btn-secondary">Resetar</button>
  </div>
</div>
