<div class="flex flex-col gap-6">
  <app-title title="Tarefas" subtitle="Exemplo de lista de tarefas" />

  <div>
    <input
      type="text"
      class="input"
      placeholder="Adicionar nova tarefa"
      (keyup.enter)="addTodo($event)"
    />
  </div>

  <div class="flex flex-col gap-4">
    @for (todo of todos(); track todo.id) {
    <div class="p-4 border border-zinc-800 rounded-lg flex items-center gap-4">
      <span [class.line-through]="todo.completed" class="text-base font-medium text-zinc-200">{{
        todo.title
      }}</span>
      <span
        [class.bg-green-700]="todo.completed"
        [class.bg-yellow-700]="!todo.completed"
        class="ml-auto text-base text-white px-3 py-2 rounded-full"
      >
        {{ todo.completed ? 'Concluído' : 'Pendente' }}
      </span>

      <div class="flex gap-2">
        <button
          (click)="toggleTodo(todo.id)"
          class="btn mr-2"
          [class.bg-green-700]="!todo.completed"
          [class.bg-yellow-700]="todo.completed"
        >
          <mat-icon fontSet="material-symbols-outlined">{{
            todo.completed ? 'undo' : 'check_circle'
          }}</mat-icon>
        </button>
        <button (click)="removeTodo(todo.id)" class="btn bg-red-700 mr-2">
          <mat-icon fontSet="material-symbols-outlined">delete</mat-icon>
        </button>
      </div>
    </div>
    }
  </div>
</div>
